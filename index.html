body {

.thread-table {

.thread-table th {

.thread-table td {

.thread-title {

}
.thread-meta {
    font-size: 11px;

    margin-top: 3px;
}
.col-img { width: 70px; text-align: center; }
.col-subject { width: auto; }
.col-author { width: 80px; }
.thumb {
    width: 60px;
    height: 60px;
    border: 1px solid #ccc;
    background-color: #f0f0f0;
    text-align: center;
    line-height: 60px;
    font-size: 11px;
    color: #999;
    display: inline-block;
}
.thumb img {
    width: 60px;
    height: 60px;
    border: none;
    cursor:pointer;
}
.footer {
    margin-top: 8px;
    text-align: center;
    font-size: 11px;
    color: #999;
}
.tip {
    background-color: #fffbe6;
    border: 1px solid #ffe58f;
    padding: 8px 12px;
    margin-bottom: 10px;
    font-size: 11px;
    color: #ad8b00;
}

/* 弹窗遮罩层 IE8兼容 */
#mask{
    display:none;
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:#000;
    filter:alpha(opacity=70);
    z-index:999;
}
/* 大图容器 */
#imgBox{
    display:none;
    position:absolute;
    z-index:1000;
}
#bigImg{
    border:3px solid #fff;
}
</style>
</head>
<body>

<!-- 弹窗结构 -->
<div id="mask" onclick="closeImg()"></div>
<div id="imgBox">
    <img id="bigImg" onclick="closeImg()" />
</div>

<script type="text/javascript">
// IE8兼容打开大图
function openImg(src){
    var mask = document.getElementById("mask");
    var box = document.getElementById("imgBox");
    var bigImg = document.getElementById("bigImg");
    bigImg.src = src;
    mask.style.display = "block";
    box.style.display = "block";

    // 居中
    function setCenter(){
        var w = document.documentElement.clientWidth;
        var h = document.documentElement.clientHeight;
        var iw = bigImg.width;
        var ih = bigImg.height;
        box.style.left = (w - iw)/2 + "px";
        box.style.top  = (h - ih)/2 + "px";
    }
    // 图片加载完成居中
    bigImg.onload = setCenter;
    setCenter();
}
function closeImg(){
    document.getElementById("mask").style.display = "none";
    document.getElementById("imgBox").style.display = "none";
}
</script>
