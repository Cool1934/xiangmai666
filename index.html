<style type="text/css">
body {
    margin: 0;

    background-color: #f4f4f4;
    font-family: "Microsoft YaHei", "宋体", sans-serif;
    font-size: 12px;
    color: #333;
}
.forum-header {
    background-color: #2b579a;
    color: #fff;
    padding: 10px 15px;
    font-size: 14px;
    font-weight: bold;
    border: 1px solid #1a3a6e;
}
.thread-table {
    width: 100%;
    border-collapse: collapse;
    background-color: #fff;
    border: 1px solid #ccc;
}
.thread-table th {
    background-color: #d6e0f0;
    color: #333;
    padding: 6px 10px;
    text-align: left;
    font-weight: normal;
    border-bottom: 1px solid #ccc;
    font-size: 11px;
}
.thread-table td {
    padding: 8px 10px;
    border-bottom: 1px solid #eee;
    vertical-align: middle;
}
.thread-title {
    font-size: 13px;
    font-weight: bold;
}
.thread-meta {
    font-size: 11px;
    color: #999;
    margin-top: 3px;
}
.col-img { width: 120px; text-align: center; }
.col-subject { width: auto; }
.col-author { width: 80px; }
.thumb {
    width: 100px;
    height: 200px;
    border: 1px solid #ccc;
    background-color: #f0f0f0;
    text-align: center;
    line-height: 200px;
    font-size: 11px;
    color: #999;
    display: inline-block;
}
.thumb img {
    width: 100px;
    height: 200px;
    border: none;
}
.footer {
    margin-top: 8px;
    text-align: center;
    font-size: 11px;
    color: #999;
}
.tip {
    background-color: #fffbe6;
    border: 1px solid #ffe58f;
    padding: 8px 12px;
    margin-bottom: 10px;
    font-size: 11px;
    color: #ad8b00;
}

</head>
